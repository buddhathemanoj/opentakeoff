name: Arcloom desktop beta packages
on:
  workflow_dispatch:
  push:
    branches: [codex/kosal-studio]
    paths:
      - 'desktop/**'
      - 'studio/**'
      - 'web/**'
      - 'test/studio/**'
      - 'electron-builder.yml'
      - 'package*.json'
      - '.github/workflows/kosal-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'studio/**'
      - 'web/**'
      - 'test/studio/**'
      - 'electron-builder.yml'
      - 'package*.json'
      - '.github/workflows/kosal-desktop.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            folder: mac-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            folder: mac
          - runner: windows-latest
            platform: win
            arch: x64
            folder: win-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run test:studio
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm run build
      - name: Build native app directory
        run: npx electron-builder --${{ matrix.platform }} dir --${{ matrix.arch }} --publish never
      - name: Exercise packaged server and bundled native Codex
        id: native_smoke
        run: node desktop/scripts/check-package.mjs release/${{ matrix.folder }}
      - name: Build installers from the verified native app
        id: installers
        run: node desktop/scripts/build-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }} release/${{ matrix.folder }}
      - name: Verify and preserve Mac installer files
        if: ${{ always() && matrix.platform == 'mac' && steps.native_smoke.outcome == 'success' }}
        run: node desktop/scripts/verify-mac-installers.mjs release
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.native_smoke.outcome == 'success' && (matrix.platform == 'mac' || steps.installers.outcome == 'success') }}
        with:
          name: arcloom-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          if-no-files-found: error
          path: |
            release/verified/*.dmg
            release/verified/*.zip
            release/*.exe
            release/verified/*.blockmap
